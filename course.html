<title>Swing Lab — Course</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root {
    --bg: #0c120e;
    --panel: #131b15;
    --panel-raised: #182219;
    --line: #26332a;
    --line-strong: #364638;
    --turf: #4bab6d;
    --flag: #e8543f;
    --sand: #d9b877;
    --paper: #eef2ea;
    --muted: #8a9a8f;
    --mono: ui-monospace, "SF Mono", "Menlo", "Cascadia Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #7ec8e3; color: var(--paper); font-family: var(--sans); overflow: hidden; }
  #viewport { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed;
    left: 0; right: 0; top: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 14px 16px;
    pointer-events: none;
  }
  .hud > * { pointer-events: auto; }

  .panel {
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    backdrop-filter: blur(6px);
  }

  .connect { display: flex; align-items: center; gap: 8px; }
  .connect input {
    background: var(--panel-raised);
    border: 1px solid var(--line-strong);
    color: var(--paper);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 9px;
    border-radius: 7px;
    width: 210px;
    outline: none;
  }
  .connect input:focus-visible { outline: 2px solid var(--sand); }
  .connect button {
    appearance: none;
    border: none;
    background: var(--turf);
    color: #06170d;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 7px;
  }
  .connect button:focus-visible { outline: 2px solid var(--sand); }
  .status { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--turf); box-shadow: 0 0 0 3px color-mix(in srgb, var(--turf) 25%, transparent); }
  .status.live { color: var(--turf); }

  .readout-stack { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .readout {
    text-align: right;
    min-width: 150px;
  }
  .readout .label { font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .readout .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 600; margin-top: 2px; }
  .readout .val .unit { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 3px; }

  .shot-line {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--sand);
    margin-top: 2px;
    min-height: 14px;
  }

  .hud-left { display: flex; flex-direction: column; gap: 10px; }

  .eyebrow { font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  .minimap-panel { padding: 10px 10px 12px; }
  .minimap-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 8px; }
  .minimap-length { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 600; color: var(--sand); }
  .minimap-length .unit { font-size: 10px; color: var(--muted); margin-left: 2px; }
  canvas#minimap { display: block; border-radius: 8px; background: #2f5233; }
  .strokes-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 2px 0; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted);
  }
  .strokes-row span:last-child { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; color: var(--paper); font-weight: 700; letter-spacing: 0; text-transform: none; }

  .builder-link {
    display: block;
    text-align: center;
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--paper);
  }
  .builder-link:focus-visible { outline: 2px solid var(--sand); }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(4, 8, 5, 0.65);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 30;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .modal { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
  .summary-lines { font-family: var(--mono); font-size: 13px; line-height: 1.7; color: var(--paper); }
  .summary-total { font-size: 15px; font-weight: 700; color: var(--sand); padding-top: 6px; border-top: 1px solid var(--line); }
  .btn {
    appearance: none; border: 1px solid var(--line-strong); background: var(--panel-raised);
    color: var(--paper); font-family: var(--sans); font-size: 12.5px; font-weight: 700;
    padding: 10px 14px; border-radius: 8px;
  }
  .btn:focus-visible { outline: 2px solid var(--sand); }
  .btn.primary { background: var(--turf); border-color: var(--turf); color: #06170d; }

  .bottom-stack {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    pointer-events: none;
  }
  .bottom-stack > * { pointer-events: auto; }

  .power-wrap { width: 260px; padding: 10px 14px; }
  .power-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .power-label #powerState.hot { color: var(--sand); }
  .power-label #powerState.practice { color: var(--sand); }
  .power-num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--paper); font-size: 12px; }
  .power-track { height: 10px; border-radius: 999px; background: var(--panel-raised); border: 1px solid var(--line); overflow: hidden; }
  .power-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--turf); transition: width 0.05s linear, background 0.15s ease; }
  .power-fill.hi { background: var(--flag); }

  .bottom-bar { display: flex; align-items: center; gap: 10px; }
  .aim-btn {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    color: var(--paper);
    font-size: 16px;
    font-weight: 700;
    width: 36px; height: 36px;
    border-radius: 50%;
    backdrop-filter: blur(6px);
  }
  .aim-btn:focus-visible { outline: 2px solid var(--sand); }
  .aim-readout {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    font-weight: 600;
    color: var(--paper);
    padding: 9px 14px;
  }
  button#reset {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 22px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  button#reset:focus-visible { outline: 2px solid var(--sand); }
</style>

<div id="viewport"></div>

<div class="hud">
  <div class="hud-left">
    <div class="panel connect">
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Offline</span></span>
      <input id="serverUrl" placeholder="wss://your-tunnel.trycloudflare.com" autocomplete="off" spellcheck="false">
      <button id="connectBtn">Connect</button>
    </div>

    <div class="panel minimap-panel">
      <div class="minimap-head">
        <span class="eyebrow">Hole <span id="holeNum">1 / 1</span> · Par <span id="holePar">4</span></span>
        <span class="minimap-length" id="holeLength">–<span class="unit">m</span></span>
      </div>
      <canvas id="minimap" width="168" height="230"></canvas>
      <div class="strokes-row"><span>Strokes</span><span id="strokes">0</span></div>
    </div>

    <a class="panel builder-link" href="builder.html" target="_blank" rel="noopener">Course Builder &rarr;</a>
  </div>

  <div class="panel readout-stack">

  </div>
</div>

  <div class="modal panel">
    <div class="eyebrow">Round Complete</div>
    <div class="summary-lines" id="summaryLines"></div>

    <button class="btn primary" id="playAgain">Play Again</button>
  </div>
</div>

<div class="bottom-stack">
  <div class="power-wrap panel">
    <div class="power-label">
      <span id="powerState">Armed</span>

    </div>
    <div class="power-track"><div class="power-fill" id="powerFill"></div></div>
  </div>

  <div class="bottom-bar">
    <button class="aim-btn" id="aimLeft">&#8249;</button>
    <div class="aim-readout panel">AIM <span id="aimVal">0&deg;</span></div>
    <button class="aim-btn" id="aimRight">&#8250;</button>
    <button id="reset">Reset to Tee</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";

// ---- Hole layout: the Phase 1 hardcoded hole, or a course loaded from Supabase ----
var BALL_RADIUS = 0.45;
var DEFAULT_FAIRWAY_WIDTH = 18;

// TEE_POS/HOLE_POS are world {x,z}; FWD/RIGHT are the unit bearing from tee to hole and its
// perpendicular, so a course doesn't have to run straight down -Z the way the hardcoded hole
// does — shots, curve, and camera all work off these vectors instead of raw axes.
var TEE_POS = { x: 0, z: 0 };
var HOLE_POS = { x: 0, z: -1 };
var FWD = { x: 0, z: -1 };
var RIGHT = { x: 1, z: 0 };
var HOLE_DISTANCE = 1;

function setHoleVectors(tee, pin) {
  TEE_POS = tee;
  HOLE_POS = pin;
  var dx = pin.x - tee.x, dz = pin.z - tee.z;
  HOLE_DISTANCE = Math.hypot(dx, dz) || 1;
  FWD = { x: dx / HOLE_DISTANCE, z: dz / HOLE_DISTANCE };
  RIGHT = { x: -FWD.z, z: FWD.x };
}

// ---- Renderer / scene ----
var viewport = document.getElementById("viewport");
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
viewport.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var skyColor = 0x7ec8e3;
scene.background = new THREE.Color(skyColor);
scene.fog = new THREE.Fog(skyColor, 60, 220);

var camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 800);

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- Lighting ----
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x2f5233, 0.9));
var sun = new THREE.DirectionalLight(0xfff2d8, 1.1);
sun.position.set(40, 60, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -80;
scene.add(sun);

// Everything hole-specific (terrain, tee/pin, trees) lives in here so a multi-hole round can
// tear one hole down and build the next without touching the ball, camera, or lighting.
var holeGroup = new THREE.Group();
scene.add(holeGroup);

function clearHoleGroup() {
  while (holeGroup.children.length) {
    var child = holeGroup.children.pop();
    holeGroup.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      (Array.isArray(child.material) ? child.material : [child.material]).forEach(function (m) { m.dispose(); });
    }
    if (child.children) {
      child.children.forEach(function (grandchild) {
        if (grandchild.geometry) grandchild.geometry.dispose();
        if (grandchild.material) grandchild.material.dispose();
      });
    }
  }
}

// Shared between both hole builders below.
function addHoleAndFlag(pos) {
  var hole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.3, 12), new THREE.MeshStandardMaterial({ color: 0x0a0f0b }));
  hole.position.set(pos.x, 0.02, pos.z);
  holeGroup.add(hole);

  var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 2.2, 6), new THREE.MeshStandardMaterial({ color: 0xe8e4d8 }));
  pole.position.set(pos.x, 1.1, pos.z);
  pole.castShadow = true;
  holeGroup.add(pole);

  var flagShape = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.35), new THREE.MeshStandardMaterial({ color: 0xe8543f, side: THREE.DoubleSide, flatShading: true }));
  flagShape.position.set(pos.x + 0.28, 1.95, pos.z);
  flagShape.castShadow = true;
  holeGroup.add(flagShape);
}

function addTeeMarkers(pos, right) {
  [-1.1, 1.1].forEach(function (side) {
    var marker = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), new THREE.MeshStandardMaterial({ color: 0xd9b877, flatShading: true }));
    marker.position.set(pos.x + right.x * side, 0.12, pos.z + right.z * side);
    holeGroup.add(marker);
  });
}

// ---- Hole builder A: the Phase 1 hardcoded hole (no course id in the URL) ----
function buildDefaultHole() {
  setHoleVectors({ x: 0, z: 6 }, { x: 0, z: 6 - 150 });

  function makeGround(width, length, segX, segZ, amplitude, color, z) {
    var geo = new THREE.PlaneGeometry(width, length, segX, segZ);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), pz = pos.getZ(i);
      var h = (Math.sin(x * 0.15 + pz * 0.05) + Math.cos(pz * 0.12)) * amplitude;
      pos.setY(i, h);
    }
    geo.computeVertexNormals();
    var mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: color, flatShading: true, roughness: 1 }));
    mesh.position.z = z;
    mesh.receiveShadow = true;
    return mesh;
  }

  var fairwayCenterZ = (TEE_POS.z + HOLE_POS.z) / 2;
  holeGroup.add(makeGround(90, HOLE_DISTANCE + 60, 30, 30, 0.5, 0x3c7a4a, fairwayCenterZ)); // rough
  holeGroup.add(makeGround(DEFAULT_FAIRWAY_WIDTH, HOLE_DISTANCE + 20, 14, 40, 0.18, 0x5a9c5f, fairwayCenterZ)); // fairway

  var green = new THREE.Mesh(
    new THREE.CircleGeometry(9, 24),
    new THREE.MeshStandardMaterial({ color: 0x6fb96a, flatShading: true, roughness: 1 })
  );
  green.rotation.x = -Math.PI / 2;
  green.position.set(HOLE_POS.x, 0.06, HOLE_POS.z);
  green.receiveShadow = true;
  holeGroup.add(green);

  addHoleAndFlag(HOLE_POS);
  addTeeMarkers(TEE_POS, RIGHT);

  // Decorative low-poly trees, no collision
  function makeTree(x, z, scale) {
    var group = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.4, 6), new THREE.MeshStandardMaterial({ color: 0x6b4a34, flatShading: true }));
    trunk.position.y = 0.7;
    var leaves = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.4, 7), new THREE.MeshStandardMaterial({ color: 0x2e6b3e, flatShading: true }));
    leaves.position.y = 2.3;
    trunk.castShadow = leaves.castShadow = true;
    group.add(trunk, leaves);
    group.position.set(x, 0, z);
    group.scale.setScalar(scale);
    return group;
  }
  for (var t = 0; t < 10; t++) {
    var side = t % 2 === 0 ? 1 : -1;
    var tz = TEE_POS.z - 8 - (t * (HOLE_DISTANCE / 10));
    holeGroup.add(makeTree(side * (10 + Math.random() * 6), tz, 0.8 + Math.random() * 0.5));
  }
}

// ---- Hole builder B: a course.tiles grid saved from builder.html ----
var TILE_STYLE = {
  rough: { color: 0x3c7a4a, y: -0.02 },
  fairway: { color: 0x5a9c5f, y: 0 },
  green: { color: 0x6fb96a, y: 0.03 },
  bunker: { color: 0xd9b877, y: -0.06 },
  water: { color: 0x3a7fc1, y: -0.08 },
  tree: { color: 0x3c7a4a, y: -0.02 } // base under a tree tile is grass; the tree itself sits on top
};

function buildLayerMesh(cells, color, yOffset, tileSize) {
  if (!cells.length) return null;
  var geo = new THREE.BoxGeometry(tileSize * 0.98, 0.14, tileSize * 0.98);
  var mat = new THREE.MeshStandardMaterial({ color: color, flatShading: true, roughness: 1 });
  var mesh = new THREE.InstancedMesh(geo, mat, cells.length);
  mesh.receiveShadow = true;
  var m = new THREE.Matrix4();
  cells.forEach(function (c, i) {
    m.makeTranslation(c.x, yOffset, c.z);
    mesh.setMatrixAt(i, m);
  });
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

function buildTileHole(course) {
  var cols = course.grid_cols, rows = course.grid_rows, tileSize = course.tile_size || 5;

  function worldFromTile(tx, ty) {
    return { x: (tx - cols / 2) * tileSize, z: -ty * tileSize };
  }

  setHoleVectors(worldFromTile(course.tee.x, course.tee.y), worldFromTile(course.pin.x, course.pin.y));

  var grid = [];
  for (var y = 0; y < rows; y++) grid.push(new Array(cols).fill("rough"));
  (course.tiles || []).forEach(function (t) {
    if (grid[t.y] && t.x >= 0 && t.x < cols) grid[t.y][t.x] = t.type;
  });

  var byType = {};
  var treeCells = [];
  for (var ty = 0; ty < rows; ty++) {
    for (var tx = 0; tx < cols; tx++) {
      var type = grid[ty][tx];
      var w = worldFromTile(tx, ty);
      (byType[type] || (byType[type] = [])).push(w);
      if (type === "tree") treeCells.push(w);
    }
  }

  Object.keys(byType).forEach(function (type) {
    var style = TILE_STYLE[type] || TILE_STYLE.rough;
    var mesh = buildLayerMesh(byType[type], style.color, style.y, tileSize);
    if (mesh) holeGroup.add(mesh);
  });

  if (treeCells.length) {
    var trunkMesh = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.12, 0.16, 1.4, 6),
      new THREE.MeshStandardMaterial({ color: 0x6b4a34, flatShading: true }),
      treeCells.length
    );
    var leafMesh = new THREE.InstancedMesh(
      new THREE.ConeGeometry(1.1, 2.4, 7),
      new THREE.MeshStandardMaterial({ color: 0x2e6b3e, flatShading: true }),
      treeCells.length
    );
    trunkMesh.castShadow = leafMesh.castShadow = true;
    var m = new THREE.Matrix4();
    var q = new THREE.Quaternion();
    treeCells.forEach(function (w, i) {
      var scale = 0.8 + Math.random() * 0.5;
      m.compose(new THREE.Vector3(w.x, 0.7 * scale, w.z), q, new THREE.Vector3(scale, scale, scale));
      trunkMesh.setMatrixAt(i, m);
      m.compose(new THREE.Vector3(w.x, 2.3 * scale, w.z), q, new THREE.Vector3(scale, scale, scale));
      leafMesh.setMatrixAt(i, m);
    });
    trunkMesh.instanceMatrix.needsUpdate = true;
    leafMesh.instanceMatrix.needsUpdate = true;
    holeGroup.add(trunkMesh, leafMesh);
  }

  addHoleAndFlag(HOLE_POS);
  addTeeMarkers(TEE_POS, RIGHT);
}

// ---- Round / scoring state ----
// roundHoles is either the holes fetched for a saved course, or a single { isDefault: true }
// entry standing in for the Phase 1 hardcoded hole — either way the rest of the round/scoring
// machinery below doesn't need to know which.
var roundHoles = [{ isDefault: true, par: 4 }];
var currentHoleIdx = 0;
var currentPar = 4;
var strokesThisHole = 0;
var scorecard = [];
var CUP_RADIUS = 0.55; // generous vs. the real ~0.108m hole — matches this physics model's precision, not real golf
var SCORE_NAME = { "-3": "Albatross", "-2": "Eagle", "-1": "Birdie", "0": "Par", "1": "Bogey", "2": "Double Bogey" };

function loadHole(idx) {
  currentHoleIdx = idx;
  clearHoleGroup();

  var h = roundHoles[idx];
  currentPar = h.par || 4;
  if (h.isDefault) {
    buildDefaultHole();
    buildMinimapBackground(null);
  } else {
    buildTileHole(h);
    buildMinimapBackground(h);
  }

  document.getElementById("holePar").textContent = currentPar;
  document.getElementById("holeNum").textContent = (idx + 1) + " / " + roundHoles.length;

  resetBall(); // also zeroes strokesThisHole
  camera.position.set(TEE_POS.x - FWD.x * 7, 2.6, TEE_POS.z - FWD.z * 7);
  camera.lookAt(TEE_POS.x + FWD.x * 25, 1, TEE_POS.z + FWD.z * 25);
}

function scoreLabel(strokes, par) {
  var diff = strokes - par;
  if (diff >= 3) return diff + " over";
  return SCORE_NAME[String(diff)] || (diff > 0 ? "+" + diff : diff);
}

function onHoleComplete() {
  scorecard.push({ hole: currentHoleIdx + 1, par: currentPar, strokes: strokesThisHole });
  settled = true;
  cameraMode = "result";

  var label = scoreLabel(strokesThisHole, currentPar);
  els.shotLine.textContent = "Holed in " + strokesThisHole + " · " + label;

  if (currentHoleIdx + 1 < roundHoles.length) {
    setTimeout(function () { loadHole(currentHoleIdx + 1); }, 2600);
  } else {
    setTimeout(showRoundSummary, 1400);
  }
}

function showRoundSummary() {
  var totalStrokes = scorecard.reduce(function (s, h) { return s + h.strokes; }, 0);
  var totalPar = scorecard.reduce(function (s, h) { return s + h.par; }, 0);
  var lines = scorecard.map(function (h) {
    return "Hole " + h.hole + ": " + h.strokes + " (par " + h.par + ", " + scoreLabel(h.strokes, h.par) + ")";
  });
  document.getElementById("summaryLines").innerHTML = lines.join("<br>");
  document.getElementById("summaryTotal").textContent = totalStrokes + " (" + (totalStrokes - totalPar >= 0 ? "+" : "") + (totalStrokes - totalPar) + ")";
  document.getElementById("roundSummary").classList.add("show");

  // Keeps the door open for leaderboards later — just persisting results for now, no UI reads
  // this back yet.
  if (loadedCourseId) {
    fetch(SUPABASE_URL + "/rest/v1/rounds", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }),
      body: JSON.stringify([{ course_id: loadedCourseId, hole_scores: scorecard, total_strokes: totalStrokes, total_par: totalPar, completed: true }])
    }).catch(function () { /* best-effort */ });
  }
}

document.getElementById("playAgain").addEventListener("click", function () {
  scorecard = [];
  document.getElementById("roundSummary").classList.remove("show");
  loadHole(0);
});

// ---- Ball + physics + gameplay bootstrap ----
// Deferred behind a function because loading a course from Supabase is async.
var ballMesh, world, ballBody;

function startGameplay() {
  ballMesh = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_RADIUS, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true, roughness: 0.6 })
  );
  ballMesh.castShadow = true;
  scene.add(ballMesh);

  // The visual terrain has gentle vertex displacement (default hole) or per-tile height
  // (tile courses), but the physics ground is a single flat plane — matching either to a
  // heightfield is more precision than Phase 1/2 needs; a ball occasionally clipping a small
  // visual bump is an acceptable trade for now.
  world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });

  var groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
  groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
  world.addBody(groundBody);

  ballBody = new CANNON.Body({
    mass: 0.045,
    shape: new CANNON.Sphere(BALL_RADIUS),
    linearDamping: 0.32,
    angularDamping: 0.5
  });
  world.addBody(ballBody);

  var contact = new CANNON.ContactMaterial(groundBody.material || new CANNON.Material(), ballBody.material || new CANNON.Material(), {
    friction: 0.45,
    restitution: 0.35
  });
  world.addContactMaterial(contact);

  if (els.serverUrl.value) connect();
  clock = new THREE.Clock();
  loadHole(0);
  animate();
}

function resetBall() {
  ballBody.position.set(TEE_POS.x, BALL_RADIUS + 0.02, TEE_POS.z);
  ballBody.velocity.set(0, 0, 0);
  ballBody.angularVelocity.set(0, 0, 0);
  ballBody.wakeUp();
  flightCurveStrength = 0;
  shotStartPos = null;
  settled = true;
  cameraMode = "tee";
  // Moving the ball back to the tee — whether starting a fresh hole or hitting the manual
  // reset button mid-hole — is a restart of this hole either way, so the stroke count resets.
  strokesThisHole = 0;
  els.strokes.textContent = 0;
  els.toPin.innerHTML = HOLE_DISTANCE.toFixed(0) + '<span class="unit">m</span>';
  document.getElementById("holeLength").innerHTML = HOLE_DISTANCE.toFixed(0) + '<span class="unit">m</span>';
}

// ---- Minimap ----
// Static terrain is cached to an offscreen canvas once when the hole is built (cheap to reuse
// every frame); the ball dot and aim line are the only things redrawn on top each tick.
var loadedCourseId = null;
var mmCanvas = document.getElementById("minimap");
var mmCtx = mmCanvas.getContext("2d");
var MM_W = mmCanvas.width, MM_H = mmCanvas.height;
var mmBg = document.createElement("canvas");
mmBg.width = MM_W; mmBg.height = MM_H;
var mmBgCtx = mmBg.getContext("2d");
var mmScale = 1, mmOffX = 0, mmOffZ = 0;
var MM_TYPE_COLOR = { rough: "#3c7a4a", fairway: "#5a9c5f", green: "#6fb96a", bunker: "#d9b877", water: "#3a7fc1", tree: "#2e6b3e" };

function worldToMM(x, z) {
  return { x: mmOffX + x * mmScale, y: mmOffZ + z * mmScale };
}

function buildMinimapBackground(course) {
  var minX, maxX, minZ, maxZ;
  if (course) {
    var cols = course.grid_cols, rows = course.grid_rows, ts = course.tile_size || 5;
    minX = -cols / 2 * ts; maxX = cols / 2 * ts; minZ = -rows * ts; maxZ = 0;
  } else {
    minX = -22; maxX = 22; minZ = HOLE_POS.z - 12; maxZ = TEE_POS.z + 12;
  }
  var worldW = maxX - minX, worldH = maxZ - minZ;
  mmScale = Math.min(MM_W / worldW, MM_H / worldH) * 0.9;
  mmOffX = MM_W / 2 - (minX + maxX) / 2 * mmScale;
  mmOffZ = MM_H / 2 - (minZ + maxZ) / 2 * mmScale;

  mmBgCtx.fillStyle = "#2f5233";
  mmBgCtx.fillRect(0, 0, MM_W, MM_H);

  if (course) {
    var cols = course.grid_cols, rows = course.grid_rows, ts = course.tile_size || 5;
    var grid = [];
    for (var y = 0; y < rows; y++) grid.push(new Array(cols).fill("rough"));
    (course.tiles || []).forEach(function (t) { if (grid[t.y]) grid[t.y][t.x] = t.type; });
    var cellW = Math.max(1, ts * mmScale), cellH = Math.max(1, ts * mmScale);
    for (var ty = 0; ty < rows; ty++) {
      for (var tx = 0; tx < cols; tx++) {
        var w = { x: (tx - cols / 2) * ts, z: -ty * ts };
        var p = worldToMM(w.x, w.z);
        mmBgCtx.fillStyle = MM_TYPE_COLOR[grid[ty][tx]] || MM_TYPE_COLOR.rough;
        mmBgCtx.fillRect(p.x - cellW / 2, p.y - cellH / 2, cellW + 0.5, cellH + 0.5);
      }
    }
  } else {
    var teePt = worldToMM(TEE_POS.x, TEE_POS.z), holePt = worldToMM(HOLE_POS.x, HOLE_POS.z);
    mmBgCtx.strokeStyle = "#5a9c5f";
    mmBgCtx.lineWidth = Math.max(6, DEFAULT_FAIRWAY_WIDTH * mmScale);
    mmBgCtx.lineCap = "round";
    mmBgCtx.beginPath(); mmBgCtx.moveTo(teePt.x, teePt.y); mmBgCtx.lineTo(holePt.x, holePt.y); mmBgCtx.stroke();
  }

  var teeDot = worldToMM(TEE_POS.x, TEE_POS.z);
  mmBgCtx.fillStyle = "#d9b877";
  mmBgCtx.beginPath(); mmBgCtx.arc(teeDot.x, teeDot.y, 3, 0, Math.PI * 2); mmBgCtx.fill();

  var holeDot = worldToMM(HOLE_POS.x, HOLE_POS.z);
  mmBgCtx.fillStyle = "#e8543f";
  mmBgCtx.beginPath(); mmBgCtx.arc(holeDot.x, holeDot.y, 3.5, 0, Math.PI * 2); mmBgCtx.fill();
}

function drawMinimapFrame() {
  if (!ballBody) return;
  mmCtx.clearRect(0, 0, MM_W, MM_H);
  mmCtx.drawImage(mmBg, 0, 0);

  if (cameraMode === "tee") {
    var aim = rotateBasis(aimOffsetDeg);
    var end = { x: ballBody.position.x + aim.fwd.x * HOLE_DISTANCE * 0.4, z: ballBody.position.z + aim.fwd.z * HOLE_DISTANCE * 0.4 };
    var p1 = worldToMM(ballBody.position.x, ballBody.position.z);
    var p2 = worldToMM(end.x, end.z);
    mmCtx.strokeStyle = "#e8543f";
    mmCtx.lineWidth = 1.5;
    mmCtx.setLineDash([3, 3]);
    mmCtx.beginPath(); mmCtx.moveTo(p1.x, p1.y); mmCtx.lineTo(p2.x, p2.y); mmCtx.stroke();
    mmCtx.setLineDash([]);
  }

  var ballPt = worldToMM(ballBody.position.x, ballBody.position.z);
  mmCtx.fillStyle = "#eef2ea";
  mmCtx.strokeStyle = "rgba(0,0,0,0.4)";
  mmCtx.lineWidth = 1;
  mmCtx.beginPath(); mmCtx.arc(ballPt.x, ballPt.y, 3, 0, Math.PI * 2); mmCtx.fill(); mmCtx.stroke();
}

// ---- Shot application ----
var DEG2RAD = Math.PI / 180;
// Ball-speed range at full power for a driver (loft 10.5, speedMult 1.0) — picked by working
// backwards from real average driver carry (~210m) through plain no-drag projectile range
// (V^2 sin(2θ)/g), which also lands PGA-average-ish driver ball speed (~75 m/s) for free.
var BASE_MIN_SPEED = 25, BASE_MAX_SPEED = 76;
var DEFAULT_LOFT = 10.5, DEFAULT_SPEED_MULT = 1.0;
// pathVal/faceVal are accumulated-degree sensor proxies, not calibrated real angles —
// these scale factors are a rough game-feel guess, tune once real swings are visible.
var START_ANGLE_SCALE = 0.5;
var CURVE_SCALE = 0.05;
var CURVE_ACCEL = 6; // m/s^2 of lateral drift per unit of normalized curve strength, while airborne

var flightCurveStrength = 0;
var shotStartPos = null;
var settled = true;
var cameraMode = "tee"; // tee | flight | result
var shotRight = { x: 1, z: 0 }; // RIGHT used by the shot in flight, captured at launch (see aim below)

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---- Aim ----
// Player-controlled offset from the tee->hole bearing (FWD), so a shot doesn't always have to
// go dead straight at the pin. Camera stays anchored to the real hole bearing regardless —
// only the launched ball's direction uses the aimed vectors.
var aimOffsetDeg = 0;
var AIM_STEP = 2;

function rotateBasis(deg) {
  var rad = deg * DEG2RAD;
  var c = Math.cos(rad), s = Math.sin(rad);
  return {
    fwd: { x: FWD.x * c + RIGHT.x * s, z: FWD.z * c + RIGHT.z * s },
    right: { x: RIGHT.x * c - FWD.x * s, z: RIGHT.z * c - FWD.z * s }
  };
}

// A trail of ground dots along the aimed direction, visible in the main viewport (not just the
// minimap). Deliberately just positioned points rather than a rotated/stretched mesh — that
// needs no orientation math at all, so there's no risk of a sign error pointing it backwards.
var AIM_DOTS_N = 8, AIM_DOT_SPACING = 3.2;
var aimDots = [];
for (var aimDotI = 0; aimDotI < AIM_DOTS_N; aimDotI++) {
  var aimDot = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xe8543f, transparent: true, opacity: 1 - aimDotI * 0.09 })
  );
  scene.add(aimDot);
  aimDots.push(aimDot);
}

function updateAimTrail() {
  var visible = cameraMode === "tee" && !!ballBody;
  aimDots.forEach(function (d) { d.visible = visible; });
  if (!visible) return;
  var aim = rotateBasis(aimOffsetDeg);
  for (var i = 0; i < AIM_DOTS_N; i++) {
    var t = (i + 1.5) * AIM_DOT_SPACING;
    aimDots[i].position.set(
      ballBody.position.x + aim.fwd.x * t,
      0.16,
      ballBody.position.z + aim.fwd.z * t
    );
  }
}

function setAim(deg) {
  // Full circle, not clamped to a narrow cone — wraps like a compass rather than hitting a
  // hard stop, so spinning past +-180 just keeps going the same direction.
  aimOffsetDeg = ((deg + 180) % 360 + 360) % 360 - 180;
  document.getElementById("aimVal").textContent = Math.round(aimOffsetDeg) + "°";
  drawMinimapFrame();
  updateAimTrail();
}

// Hold-to-repeat on the on-screen buttons — a single click per 2 degrees would take 90+
// clicks to turn the aim around; holding one down sweeps it continuously instead.
function holdToRepeat(el, step) {
  var interval = null;
  function start() {
    setAim(aimOffsetDeg + step);
    interval = setInterval(function () { setAim(aimOffsetDeg + step); }, 60);
  }
  function stop() { clearInterval(interval); interval = null; }
  el.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(function (evt) { el.addEventListener(evt, stop); });
}
holdToRepeat(document.getElementById("aimLeft"), -AIM_STEP);
holdToRepeat(document.getElementById("aimRight"), AIM_STEP);

window.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft") setAim(aimOffsetDeg - AIM_STEP);
  if (e.key === "ArrowRight") setAim(aimOffsetDeg + AIM_STEP);
});

function launchShot(shot) {
  var power = clamp(shot.power || 0, 1, 100);
  var pathVal = shot.pathVal || 0;
  var faceVal = shot.faceVal || 0;
  var loftDeg = shot.loftDeg || DEFAULT_LOFT;
  var speedMult = shot.speedMult || DEFAULT_SPEED_MULT;

  // Real stroke play now — each shot plays on from wherever the last one settled, rather than
  // resetting to the tee every time (that made sense for Phase 1's driving-range loop, but
  // would make the stroke count meaningless once holing out and scoring are real).
  strokesThisHole++;
  els.strokes.textContent = strokesThisHole;
  ballBody.velocity.set(0, 0, 0);
  ballBody.angularVelocity.set(0, 0, 0);
  ballBody.wakeUp();
  settled = false;
  cameraMode = "flight";
  shotStartPos = ballBody.position.clone();

  var aim = rotateBasis(aimOffsetDeg);
  shotRight = aim.right;

  var speed = (BASE_MIN_SPEED + (power / 100) * (BASE_MAX_SPEED - BASE_MIN_SPEED)) * speedMult;
  // shotRight is the golfer's right after aim (perpendicular to the aimed direction). On the
  // phone, positive faceVal means CLOSED, which for a right-handed golfer starts/curves the
  // ball LEFT — so both terms need the sign flipped to land in the correct direction here.
  // For a left-handed golfer the same closed face curves the ball the other way (toward THEIR
  // right), so handSign flips it again — mirrors the righty logic, not itself verified on a
  // real left-handed swing.
  var handSign = shot.hand === "L" ? -1 : 1;
  var startAngleDeg = clamp(-handSign * faceVal * START_ANGLE_SCALE, -32, 32);
  // Higher-lofted clubs impart more backspin relative to sidespin, so they curve less in
  // real golf — a driver (10.5°) curves noticeably, a lob wedge (60°) barely at all.
  var curveMultiplier = clamp(12 / loftDeg, 0.2, 1.3);
  flightCurveStrength = clamp(-handSign * (faceVal - pathVal) * CURVE_SCALE * curveMultiplier, -1, 1);

  var angleRad = startAngleDeg * DEG2RAD;
  var loftRad = loftDeg * DEG2RAD;
  var forwardSpeed = speed * Math.cos(angleRad) * Math.cos(loftRad);
  var sideSpeed = speed * Math.sin(angleRad) * Math.cos(loftRad);

  ballBody.velocity.set(
    aim.fwd.x * forwardSpeed + shotRight.x * sideSpeed,
    speed * Math.sin(loftRad),
    aim.fwd.z * forwardSpeed + shotRight.z * sideSpeed
  );

  els.lastShot.innerHTML = "–<span class=\"unit\">m</span>";
  var line = shot.clubName ? shot.clubName : "";
  if (shot.shot) line += (line ? " · " : "") + shot.shot;
  line += (line ? " · " : "") + "PWR " + Math.round(power);
  els.shotLine.textContent = line;
}

// ---- WebSocket ----
var els = {
  status: document.getElementById("status"),
  statusText: document.getElementById("statusText"),
  serverUrl: document.getElementById("serverUrl"),
  connectBtn: document.getElementById("connectBtn"),
  toPin: document.getElementById("toPin"),
  lastShot: document.getElementById("lastShot"),
  shotLine: document.getElementById("shotLine"),
  powerFill: document.getElementById("powerFill"),
  powerNum: document.getElementById("powerNum"),
  powerState: document.getElementById("powerState"),
  strokes: document.getElementById("strokes")
};

var STORAGE_KEY = "swingLabServerUrl";
els.serverUrl.value = localStorage.getItem(STORAGE_KEY) || "";

// ---- Power bar ----
// Driven live by "power" messages the phone streams throughout the swing (not just the final
// number at impact), so this fills up in real time as the swing happens.
function setPowerBar(power, hot) {
  els.powerFill.style.width = clamp(power, 0, 100) + "%";
  els.powerFill.classList.toggle("hi", power > 85);
  els.powerNum.textContent = Math.round(power);
  els.powerState.classList.toggle("hot", hot && power > 4);
}

var practiceFlashTimer = null;
function showPracticeSwing(shot) {
  var power = clamp(shot.power || 0, 0, 100);
  setPowerBar(power, true);
  els.powerState.textContent = "Practice";
  els.powerState.classList.add("practice");
  var line = shot.clubName ? shot.clubName : "";
  if (shot.shot) line += (line ? " · " : "") + shot.shot;
  line += (line ? " · " : "") + "PWR " + Math.round(power) + " (practice)";
  els.shotLine.textContent = line;

  clearTimeout(practiceFlashTimer);
  practiceFlashTimer = setTimeout(function () {
    setPowerBar(0, false);
    els.powerState.textContent = "Armed";
    els.powerState.classList.remove("practice");
  }, 1400);
}

var socket = null;
function connect() {
  var url = els.serverUrl.value.trim();
  if (!url) return;
  localStorage.setItem(STORAGE_KEY, url);
  if (socket) socket.close();

  socket = new WebSocket(url);
  socket.onopen = function () {
    els.status.classList.add("live");
    els.statusText.textContent = "Live";
  };
  socket.onclose = function () {
    els.status.classList.remove("live");
    els.statusText.textContent = "Offline";
  };
  socket.onerror = function () {
    els.status.classList.remove("live");
    els.statusText.textContent = "Error";
  };
  socket.onmessage = function (ev) {
    try {
      var msg = JSON.parse(ev.data);
      if (msg.type === "swing") {
        if (!settled) {
          // Ball's still moving from the last shot — ignore this one rather than stack a new
          // velocity onto an already-live physics body mid-roll.
          els.shotLine.textContent = "Wait for the ball to stop";
          return;
        }
        els.powerState.textContent = "Armed";
        els.powerState.classList.remove("practice");
        launchShot(msg);
      } else if (msg.type === "practice") {
        showPracticeSwing(msg);
      } else if (msg.type === "power") {
        els.powerState.textContent = msg.power > 4 ? "Swinging" : "Armed";
        setPowerBar(msg.power, true);
      }
    } catch (e) { /* ignore malformed frames */ }
  };
}
els.connectBtn.addEventListener("click", connect);
document.getElementById("reset").addEventListener("click", resetBall);

// ---- Animation loop ----
// clock/resetBall/connect are all invoked from startGameplay() at the bottom of this file,
// once whichever hole builder (default or a loaded course) has finished running.
function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 1 / 30);

  if (!settled) {
    var airborne = ballBody.position.y > BALL_RADIUS + 0.05;
    if (airborne && flightCurveStrength !== 0) {
      ballBody.velocity.x += shotRight.x * flightCurveStrength * CURVE_ACCEL * dt;
      ballBody.velocity.z += shotRight.z * flightCurveStrength * CURVE_ACCEL * dt;
    }
  }

  world.step(1 / 60, dt, 5);

  ballMesh.position.copy(ballBody.position);
  ballMesh.quaternion.copy(ballBody.quaternion);

  if (!settled) {
    var toPinNow = Math.hypot(ballBody.position.x - HOLE_POS.x, ballBody.position.z - HOLE_POS.z);
    if (toPinNow < CUP_RADIUS && ballBody.position.y < BALL_RADIUS + 0.3) {
      onHoleComplete();
    } else {
      var speed = ballBody.velocity.length();
      if (speed < 0.35 && ballBody.position.y <= BALL_RADIUS + 0.05) {
        settled = true;
        cameraMode = "result";
        var dx = ballBody.position.x - shotStartPos.x;
        var dz = ballBody.position.z - shotStartPos.z;
        var carried = Math.sqrt(dx * dx + dz * dz);
        els.lastShot.innerHTML = carried.toFixed(1) + '<span class="unit">m</span>';
        els.toPin.innerHTML = toPinNow.toFixed(1) + '<span class="unit">m</span>';
        // Aiming has to come back for every shot, not just the tee shot — after a moment to
        // see where this one landed, hand aim control back for the next one.
        setTimeout(function () { if (cameraMode === "result") cameraMode = "tee"; }, 1300);
      }
    }
  }

  // Camera — "tee" here really means "ball at rest, aiming the next shot", which applies
  // after every shot, not just the first — so this frames from the ball's current position,
  // not the hole's actual tee (which subsequent shots aren't played from).
  if (cameraMode === "tee") {
    var teeCamPos = new THREE.Vector3(ballMesh.position.x - FWD.x * 7, ballMesh.position.y + 2.6, ballMesh.position.z - FWD.z * 7);
    camera.position.lerp(teeCamPos, 0.08);
    camera.lookAt(ballMesh.position.x + FWD.x * 25, ballMesh.position.y + 1, ballMesh.position.z + FWD.z * 25);
  } else {
    var desired = new THREE.Vector3(ballMesh.position.x - FWD.x * 7, ballMesh.position.y + 3.2, ballMesh.position.z - FWD.z * 7);
    camera.position.lerp(desired, 0.06);
    camera.lookAt(ballMesh.position.x + FWD.x * 6, ballMesh.position.y + 0.5, ballMesh.position.z + FWD.z * 6);
  }

  drawMinimapFrame();
  updateAimTrail();
  renderer.render(scene, camera);
}

var clock;

var SUPABASE_URL = "https://bgoolrrjbagrifonwfgw.supabase.co";
var SUPABASE_KEY = "sb_publishable_0aGwrw5IzeVDtsrVDUYXwg_Mii1vwGt";

(async function boot() {
  var courseId = new URLSearchParams(location.search).get("course");
  if (courseId) {
    try {
      var sbHeaders = { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY };
      var results = await Promise.all([
        fetch(SUPABASE_URL + "/rest/v1/courses?id=eq." + encodeURIComponent(courseId) + "&select=*", { headers: sbHeaders }).then(function (r) { return r.json(); }),
        fetch(SUPABASE_URL + "/rest/v1/holes?course_id=eq." + encodeURIComponent(courseId) + "&select=*&order=hole_number.asc", { headers: sbHeaders }).then(function (r) { return r.json(); })
      ]);
      var courseRow = results[0][0], holeRows = results[1];
      if (courseRow && holeRows.length) {
        loadedCourseId = courseRow.id;
        roundHoles = holeRows;
        document.title = "Swing Lab — " + (courseRow.name || "Course");
      }
    } catch (e) { /* falls through to the default hole below */ }
  }
  startGameplay();
})();
</script>
